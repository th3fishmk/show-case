<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UI practice</title>
        <link rel="stylesheet" href="./styles.css" />
        <script>
            var exports = {};
        </script>
        <script src="./dist/index.js" defer></script>
    </head>
    <body>
        <div class="main">
            <div class="header"></div>
            <div class="left-bar">
                <div class="container">
                    <div class="card">
                        <div class="tools">
                            <div class="circle">
                                <span class="red box"></span>
                            </div>
                            <div class="circle">
                                <span class="yellow box"></span>
                            </div>
                            <div class="circle">
                                <span class="green box"></span>
                            </div>
                        </div>
                        <div class="card-content">
                            <img
                                class="profile-picture"
                                src="https://avatars.githubusercontent.com/u/228313569?v=4"
                                alt="A pic of me"
                                width="150px"
                            />
                            <h2>Fish</h2>
                            <p>
                                Definitively <strong>not</strong> a graphic
                                designer
                            </p>
                            <p>Earth</p>
                            <div class="buttons">
                                <button class="gh">Github</button>
                                <button class="insta">Instagram</button>
                            </div>
                            <table>
                                <tr>
                                    <td>Github repos:</td>
                                    <td>1</td>
                                </tr>
                                <tr>
                                    <td>UI Projects</td>
                                    <td>10</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="showcase"></div>
            <div class="footer"></div>
        </div>
    </body>
</html>
