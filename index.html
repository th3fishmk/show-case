<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UI practice</title>
        <link rel="stylesheet" href="./styles.css" />
        <script>
            var exports = {};
        </script>
        <script src="./dist/index.js" defer></script>
    </head>
    <body>
        <div class="main">
            <div class="header"></div>
            <div class="left-bar">
                <div class="container">
                    <div class="card">
                        <div class="tools">
                            <div class="circle">
                                <span class="red box"></span>
                            </div>
                            <div class="circle">
                                <span class="yellow box"></span>
                            </div>
                            <div class="circle">
                                <span class="green box"></span>
                            </div>
                        </div>
                        <div class="card-content">
                            <img
                                class="profile-picture"
                                src="https://avatars.githubusercontent.com/u/228313569?v=4"
                                alt="A pic of me"
                                width="150px"
                            />
                            <h2>Fish</h2>
                            <p>
                                Definitively <strong>not</strong> a graphic
                                designer
                            </p>
                            <p>Earth</p>
                            <div class="buttons">
                                <button class="gh" id="github-btn">
                                    <img
                                        src="./resources/github_light.png"
                                        width="20px"
                                        height="auto"
                                        alt=""
                                    />
                                    Github
                                </button>
                                <button class="insta" id="insta-btn">
                                    <img
                                        src="./resources/instagram.png"
                                        width="20px"
                                        height="auto"
                                        alt=""
                                    />
                                    Instagram
                                </button>
                            </div>
                            <table>
                                <tr>
                                    <td>
                                        <img
                                            src="./resources/github.png"
                                            width="20px"
                                            height="auto"
                                            alt=""
                                        />
                                        Github repos:
                                    </td>
                                    <td id="repo-count">1</td>
                                </tr>
                                <tr>
                                    <td>
                                        <img
                                            src="./resources/web-programming.png"
                                            width="20px"
                                            height="auto"
                                            alt=""
                                        />
                                        UI Projects
                                    </td>
                                    <td>10</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="showcase">
                <div class="title">
                    <h1>My projects will go here</h1>
                </div>
                <div class="content"></div>
            </div>
            <div class="footer">
                <div class="p">
                    This site is not a portfolio, nor any kind of advertisement
                    for myself, this is just a <strong>container</strong> for my
                    UI practice projects <br />
                </div>
            </div>
        </div>
    </body>
</html>
